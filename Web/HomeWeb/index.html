<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotor Control</title>
<style>
    :root {
        --text-color: #d6d6d6;
        --accent-color: #39ff88;
        --header-glow: 0 0 12px rgba(57, 255, 136, 0.25);
        --background-color: #000000;
        --background-gradient: linear-gradient(90deg, var(--background-color) 0%, rgb(27, 27, 27) 50%, var(--background-color) 100%);
        --header-font: 'Oswald', sans-serif;
        --text-font: 'Share Tech Mono', monospace;
    }

    body {
        margin: 0;
        padding: 0;
        font-family: var(--text-font);
        background: var(--background-gradient);
        color: var(--text-color);
        min-height: 100vh;
    }

    body::before {
        content: '';
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0px, transparent 1px, transparent 3px);
        z-index: 1;
    }

    section { margin: 20px; }

    h1, h2 {
        font-family: var(--header-font);
        letter-spacing: 1px;
        text-shadow: var(--header-glow);
    }
    h1 { text-transform: uppercase; }

    .rotor {
        display: flex;
        flex-direction: column;
        max-width: 900px;
        margin: 0 auto;
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 5px;
        border-radius: 10px;
        background-color: #1f1f1f;
        text-align: center;
    }

    .rotor img {
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: contain;
        display: block;
        border: 2px solid rgba(30, 30, 30, 0.4);
        border-radius: 10px;
        box-sizing: border-box;
        background: #000;
    }

    .rotorButtons {
        display: flex;
        flex-direction: row;
        gap: 20px;
        margin: 10px;
    }

    .rotorBtn {
        flex: 1;
        background: rgba(210, 210, 210, 0.1);
        border: 1px solid rgba(168, 168, 168, 0.1);
        border-radius: 8px;
        padding: 1.5rem;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        color: #ffffff;
        font-family: inherit;
        font-size: larger;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
    }

    .rotorBtn:hover {
        transform: scale(1.03);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        border: 1px solid var(--accent-color);
    }

    .rotorBtn:active,
    .rotorBtn.held {
        background: rgba(57, 255, 136, 0.15);
        border: 1px solid var(--accent-color);
        transform: scale(1.00);
    }

    .stopBtn {
        background: rgba(223, 61, 61, 0.75);
        border: 1px solid rgba(168, 168, 168, 0.1);
        border-radius: 8px;
        padding: 1.5rem;
        margin: 0 10px 10px;
        transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        color: #ffffff;
        font-family: inherit;
        font-size: larger;
        cursor: pointer;
    }

    .stopBtn:hover {
        transform: scale(1.015);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        border: 1px solid var(--accent-color);
    }

    .stopBtn:active {
        background: rgba(110, 30, 30, 0.75);
        transform: scale(1.00);
    }

    #status {
        margin: 0 10px 10px;
        min-height: 1.2em;
        font-size: 0.9rem;
        color: #8a8a8a;
    }
    #status.error { color: #ff6b6b; }

    .settings {
        max-width: 900px;
        margin: 60vh auto 40px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        padding: 5px 15px 15px;
        border-radius: 10px;
        background-color: #1f1f1f;
    }

    .settings label {
        display: block;
        margin: 15px 0 5px;
    }

    .settings input {
        width: 100%;
        box-sizing: border-box;
        padding: 0.9rem;
        background: rgba(210, 210, 210, 0.1);
        border: 1px solid rgba(168, 168, 168, 0.1);
        border-radius: 8px;
        color: #ffffff;
        font-family: inherit;
        font-size: 1rem;
    }

    .settings input:focus {
        outline: none;
        border: 1px solid var(--accent-color);
    }

    .settings small { display: block; margin-top: 4px; color: #8a8a8a; }

    .settingsButtons { display: flex; gap: 10px; margin-top: 20px; }

    .settingsBtn {
        flex: 1;
        background: rgba(210, 210, 210, 0.1);
        border: 1px solid rgba(168, 168, 168, 0.1);
        border-radius: 8px;
        padding: 1rem;
        color: #ffffff;
        font-family: inherit;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .settingsBtn:hover { border: 1px solid var(--accent-color); }

    #settingsMsg { margin-top: 10px; min-height: 1.2em; color: var(--accent-color); }
</style>
</head>
<body>
<section>
    <h1>HamControl</h1>

    <div class="rotor">
        <h2>Rotor Control</h2>

        <div class="rotorButtons">
            <button class="rotorBtn" data-dir="ccw">◀ Left</button>
            <button class="rotorBtn" data-dir="cw">Right ▶</button>
        </div>

        <button class="stopBtn" id="stopBtn">Stop</button>
        <div id="status"></div>

        <img id="camFeed" alt="Live feed">
    </div>

    <div class="settings">
        <h2>Settings</h2>

        <label for="rotorIp">Rotor IP</label>
        <input id="rotorIp" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="192.168.178.200">
        <small>Address of the rotor controller.</small>

        <label for="camIp">Camera IP</label>
        <input id="camIp" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="192.168.178.169">
        <small>Port 8080 and /videofeed are added automatically. Enter a full URL to override.</small>

        <div class="settingsButtons">
            <button class="settingsBtn" id="saveBtn">Save</button>
            <button class="settingsBtn" id="resetBtn">Reset to defaults</button>
        </div>
        <div id="settingsMsg"></div>
    </div>
</section>

<script>
    const DEFAULT_ROTOR = "192.168.178.200";
    const DEFAULT_CAM = "192.168.178.169";
    const statusEl = document.getElementById("status");
    const rotorInput = document.getElementById("rotorIp");
    const camInput = document.getElementById("camIp");
    const settingsMsg = document.getElementById("settingsMsg");
    let moving = null;
    let rotorUrl = "";

    function load(key, fallback) {
        try { return localStorage.getItem(key) || fallback; } catch (e) { return fallback; }
    }

    function store(key, value) {
        try { localStorage.setItem(key, value); return true; } catch (e) { return false; }
    }

    function clear(key) {
        try { localStorage.removeItem(key); } catch (e) {}
    }

    function buildRotorUrl(value) {
        value = value.trim().replace(/\/+$/, "");
        return /^https?:\/\//i.test(value) ? value : "http://" + value;
    }

    function buildCamUrl(value) {
        value = value.trim();
        if (/^https?:\/\//i.test(value)) return value;
        if (value.includes("/")) return "http://" + value;
        if (!value.includes(":")) value += ":8080";
        return "http://" + value + "/videofeed";
    }

    function applySettings() {
        rotorUrl = buildRotorUrl(rotorInput.value || DEFAULT_ROTOR);
        document.getElementById("camFeed").src = buildCamUrl(camInput.value || DEFAULT_CAM);
    }

    rotorInput.value = load("rotorIp", DEFAULT_ROTOR);
    camInput.value = load("camIp", DEFAULT_CAM);
    applySettings();

    document.getElementById("saveBtn").addEventListener("click", () => {
        stop();
        const saved = store("rotorIp", rotorInput.value.trim()) && store("camIp", camInput.value.trim());
        applySettings();
        settingsMsg.textContent = saved ? "Saved" : "Applied, but this browser could not save it";
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
        stop();
        clear("rotorIp");
        clear("camIp");
        rotorInput.value = DEFAULT_ROTOR;
        camInput.value = DEFAULT_CAM;
        applySettings();
        settingsMsg.textContent = "Reset to defaults";
    });

    function send(path) {
        return fetch(rotorUrl + path, { mode: "no-cors" })
            .then(() => {
                statusEl.className = "";
                statusEl.textContent = path === "/stop" ? "Stopped" : "Moving " + path.slice(1).toUpperCase();
            })
            .catch(() => {
                statusEl.className = "error";
                statusEl.textContent = "Could not reach rotor";
            });
    }

    function start(btn) {
        moving = btn.dataset.dir;
        btn.classList.add("held");
        send("/" + moving);
    }

    function stop() {
        document.querySelectorAll(".rotorBtn.held").forEach(b => b.classList.remove("held"));
        if (moving !== null) {
            moving = null;
            send("/stop");
        }
    }

    document.querySelectorAll(".rotorBtn").forEach(btn => {
        btn.addEventListener("pointerdown", e => {
            btn.setPointerCapture(e.pointerId);
            start(btn);
        });
        btn.addEventListener("pointerup", stop);
        btn.addEventListener("pointercancel", stop);
        btn.addEventListener("contextmenu", e => e.preventDefault());
    });

    document.getElementById("stopBtn").addEventListener("click", () => {
        moving = null;
        document.querySelectorAll(".rotorBtn.held").forEach(b => b.classList.remove("held"));
        send("/stop");
    });

    window.addEventListener("blur", stop);
    document.addEventListener("visibilitychange", () => { if (document.hidden) stop(); });
</script>
</body>
</html>
