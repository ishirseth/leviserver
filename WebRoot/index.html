<!DOCTYPE html>
<html>
<head>
    <title>LeviServer</title>
    <style>
        @import url('//fonts.googleapis.com/css?family=Oswald');
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        :root {
        --text-color: #d6d6d6;
        --accent-color: #39ff88;
        --header-glow: 0 0 12px rgba(57, 255, 136, 0.25);
        --accent-glow: 0 0 8px rgba(57, 255, 136, 0.6);
        --card-bg: #1f1f1f;
        --background-color: #000000;
        --background-gradient: linear-gradient(90deg, var(--background-color) 0%, rgb(27, 27, 27) 50%, var(--background-color) 100%);

        --header-font: 'Oswald', sans-serif;
        --text-font: 'Share Tech Mono', monospace;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: var(--text-font);
            background: #121212;
            background: var(--background-gradient);
            color: var(--text-color);
        }

        section {
            padding: 0 10px;
            max-width: 1000px;
            margin: 10px;
        }

        h1 {
            font-family: var(--header-font);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: var(--header-glow);
        }

        h2, h3 {
            font-family: var(--header-font);
            letter-spacing: 1px;
            text-shadow: var(--header-glow);
        }

        .cards {
            display: flex;
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            padding: 20px 30px;
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-color);
            font-size: 20px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .card:hover {
            transform: scale(1.05);
            border: 1px solid var(--accent-color);
        }

        @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
        }
        section {
        animation: fadeInUp 0.6s ease-out both;
        }
        .projects-grid .project-card:nth-child(1) { animation-delay: 0.1s; }
        .projects-grid .project-card:nth-child(2) { animation-delay: 0.2s; }
        .projects-grid .project-card:nth-child(3) { animation-delay: 0.3s; }
    </style>
</head>
<body>
    <section>
        <h1>LeviServer</h1>
        <div class="cards">
            <a class="card" href="http://sdr.leviserver.eu">SDR</a>
            <a class="card" href="http://ishir.leviserver.eu">Ishir's Webpage</a>
        </div>
    </section>
</body>
</html>
